[workspace]
resolver = "2"
members = ["core", "anchor", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
ed25519-dalek = "3.0.0"
hex = "0.4.3"
minicbor = { version = "2.3.0", features = ["std", "derive"] }
proptest = "1.11.0"
sha2 = "0.11.0"
thiserror = "2.0.19"
uniffi = "0.32.0"

[profile.release]
lto = true
# "symbols" would delete .symtab, which UniFFI's library-mode binding
# generation reads its metadata from.
strip = "debuginfo"
