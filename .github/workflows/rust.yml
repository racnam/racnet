name: rust

on:
  push:
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Anchor smoke test
        run: cargo run -p racnet-anchor | grep -q "core $(cargo pkgid -p racnet-core | cut -d@ -f2)"

  negentropy-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Session::Token
        run: sudo apt-get update && sudo apt-get install -y libsession-token-perl
      - name: Run upstream conformance suite
        run: ./scripts/negentropy-conformance.sh
