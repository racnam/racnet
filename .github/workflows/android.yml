name: android

on:
  push:
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build core and generate bindings
        run: bindings/kotlin/build-android.sh
      - name: Lint, test, and build APK
        working-directory: android
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: racnet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: racnet-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, post offline, and verify restart persistence
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            python3 scripts/device_test.py prepare --serial emulator-5554 --apk apk/app-debug.apk --output test-runs/prepare
            python3 scripts/device_test.py offline --serial emulator-5554 --output test-runs/offline
      - name: Preserve emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence-api-${{ matrix.api }}
          path: test-runs/
          if-no-files-found: ignore
